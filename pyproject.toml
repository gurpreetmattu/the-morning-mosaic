[project]
name = "the-morning-mosaic"
version = "0.1.0"
description = "A multi-agent, source-grounded daily newsletter."
requires-python = ">=3.12,<3.13"

dependencies = [
    # API service and settings
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Agent graphs. LLM access is plain httpx against the OpenAI-compatible
    # wire format; see backend/app/llm/client.py for why not the openai SDK.
    "langgraph>=0.2",
    # Source collection and extraction
    "httpx>=0.27",
    "tenacity>=9.0",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    # Rendering
    "jinja2>=3.1",
    "weasyprint>=63.0",
    # PDF assembly: pure Python, no native deps, so merging pre-rendered
    # genre pages into one reader's file doesn't need WeasyPrint again.
    "pypdf>=5.0",
    # Cloud Storage caches assembled PDFs in prod; imported lazily so its
    # absence never affects dev, which caches to local disk instead.
    "google-cloud-storage>=2.18",
    # Config and observability
    "pyyaml>=6.0",
    "structlog>=24.4",
    "langfuse>=2.53",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# backend/app installs as `app`, evals as `evals`, so job entry points run as
# `python -m app.jobs.<name>` from anywhere without PYTHONPATH juggling. The
# Cloud Run image gets the same layout.
[tool.hatch.build.targets.wheel]
packages = ["backend/app", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# E501: test fixtures contain realistic prose; wrapping it mid-sentence makes
# the expectations harder to read than the long line.
"backend/tests/**" = ["ANN", "E501"]
"evals/tests/**" = ["ANN", "E501"]
# Fixture prose (planted-error sentences, article text) reads better whole.
"evals/datasets/**" = ["E501"]
# Migration bodies are generated; they are reviewed, not hand-styled.
"backend/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend", "evals"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*", "weasyprint.*", "google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# No pythonpath entry: the project is installed, so tests import the same
# `app` package the jobs do rather than a second copy found via sys.path.
testpaths = ["backend/tests", "evals/tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live PostgreSQL; set TEST_DATABASE_URL or it skips",
]
