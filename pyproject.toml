[project]
name = "the-morning-mosaic"
version = "0.1.0"
description = "A multi-agent, source-grounded daily newsletter."
requires-python = ">=3.12,<3.13"

dependencies = [
    # API service and settings
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Agent graphs and LLM access (LLMBuffet is OpenAI-compatible)
    "langgraph>=0.2",
    "openai>=1.54",
    # Source collection and extraction
    "httpx>=0.27",
    "tenacity>=9.0",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    # Rendering
    "jinja2>=3.1",
    "premailer>=3.10",
    "weasyprint>=63.0",
    # Config and observability
    "pyyaml>=6.0",
    "structlog>=24.4",
    "langfuse>=2.53",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["ANN"]
# Migration bodies are generated; they are reviewed, not hand-styled.
"backend/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend", "evals"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*", "weasyprint.*", "premailer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
