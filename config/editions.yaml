# Special editions are driven ONLY by this calendar.
#
# Only observances with fixed civil dates are listed. Festivals that follow the
# lunar calendar move every year and are NOT guessed here — they sit in
# `awaiting_dates` until someone fills them in from an authoritative almanac or
# the Government of India holiday notification. An absent date simply means no
# special edition that day; it never means a wrong one.

# Edition numbers are a sequential count of daily editions since launch.
# PROVISIONAL — set this to the real first send date before going live.
launch_date: 2026-10-01

# The weekend quiz is SWITCHED OFF (owner decision, 2026-10-03). Its wrong answers were other
# true stories from the same week, so several options were correct and one answer key was
# wrong ("a missing item is acceptable; a wrong one is not"). Add `quiz` back to both lists only
# after it is redesigned so the answer and every distractor are verifiable from the data.
weekend:
  saturday_features:
    - top-stories
    - longer-reads
  sunday_features:
    - top-stories
    - weekly-recap

# 2026-10 through 2027-12 lunar-calendar dates below are sourced from the
# Department of Personnel and Training's own gazetted/restricted holiday
# notifications for 2026 (O.M. F.No.12/2/2023-JCA, dated 3 July 2025) and
# 2027 (same file number, dated 16 July 2026) — dopt.gov.in's official PDFs,
# read directly rather than taken from a secondary summary. Cross-checked
# the 2027 gazetted subset against two independent secondary sources
# (staffnews.in, postalstudies.com) before use; the primary document itself
# is authoritative for the rest. Id-ul-Fitr, Id-ul-Zuha, and Muharram are
# subject to moon sighting and may shift by a day at short notice per the
# same memoranda — noted on each entry below.
