# Model assignment per LLM agent.
#
# Ids come from Groq's actual live catalog for this account, queried via
# GET /openai/v1/models and each one round-tripped through
# backend/app/llm/client.py with a Writer-shaped task (numbered passages,
# reply as strict JSON, cite passage ids) on 2026-09-18 — not from Groq's
# published docs, which listed several models (llama-3.3-70b-versatile,
# llama-3.1-8b-instant) that 404 on this account. The catalog moves fast;
# re-verify against /v1/models before trusting a doc or a blog post.
#
# Served at https://api.groq.com/openai/v1. Groq replaced freellmpool
# everywhere (dev and prod both) — see docs/BACKLOG.md — because freellmpool
# only ever served 127.0.0.1, which Cloud Run cannot reach.
#
# openai/gpt-oss-120b was the first Writer/Ranker pick, on 2026-09-18, and
# was swapped out the same day: a real build run against this account hit
# a hard 8000-tokens-per-minute limit on that model specifically (one
# single request was rejected outright for requesting 10091 tokens against
# an 8000 limit), while qwen/qwen3.8-27b succeeded on every call in the
# same run with no rate-limit errors at all. Free-tier per-model limits are
# an account fact, not something config can see in advance — verify against
# a real run's app/models/operations.py llm_calls rows before trusting a
# model choice under real load, not just a single successful smoke call.
#
# PROVISIONAL. These are chosen on live availability, vendor diversity, and
# now real-load reliability — not on measured output quality. CLAUDE.md
# requires an eval run for any model change, so treat the Writer and
# Fact-checker choices as hypotheses until /evals has run.
#
# Pinned agents must name a CONCRETE model, never a routing alias — published
# wording cannot change without an eval, which an alias that picks a
# different model per request would defeat.
#
# `orchestrator` has no real caller: app/agents/orchestrator.py has never
# made an LLM call (see its own module docstring and CLAUDE.md's agent
# table). The entry stays only because ModelsConfig's own validator requires
# every AgentKey to have one — removing it means removing "orchestrator"
# from AgentKey itself, a separate, larger cleanup, not folded in here.

request_timeout_seconds: 90.0
max_attempts: 3

agents:
  # Unused — see the module note above. Kept valid rather than a stale
  # reference to a gateway that no longer exists.
  orchestrator:
    model: openai/gpt-oss-20b
    temperature: 0.0
    max_output_tokens: 2048
    pinned: false

  # Clustering and scoring need judgement. Same model as the Writer, on the
  # same reasoning as before (may fail over, since the Fact-checker
  # re-checks after) — now qwen3.8-27b rather than gpt-oss-120b, since that
  # one's real per-minute token budget on this account cannot sustain even
  # a single genre's worth of calls.
  ranker:
    model: qwen/qwen3.8-27b
    temperature: 0.0
    # This account's real cap for this model is 1000 output tokens/minute
    # (found the hard way: a single request asking for more is rejected
    # outright, every time, regardless of retries — not a transient rate
    # limit). 900 leaves headroom rather than sitting right at the edge.
    max_output_tokens: 900
    pinned: false
    fallbacks:
      - openai/gpt-oss-20b
    # Google's Gemini free tier (tested live 2026-09-18: gemini-3.6-flash,
    # 200 OK) is a separate account's quota entirely, so it survives a Groq
    # per-minute exhaustion that no amount of retrying the same account
    # would. Only used if LLM_FALLBACK_URL/LLM_FALLBACK_API_KEY are set.
    fallback_model: gemini-3.6-flash

  # See the ranker comment above for why max_output_tokens is 900, not the
  # 4096 first tried — this model's real output-tokens-per-minute cap on
  # this account is 1000, found by a single request being rejected outright.
  writer:
    model: qwen/qwen3.8-27b
    temperature: 0.2
    max_output_tokens: 900
    pinned: true

  # Deliberately a different vendor lineage from the Writer (OpenAI-OSS,
  # not Qwen/Alibaba): a checker that shares the Writer's blind spots is
  # worth much less. Smaller than the 120b variant, so a lighter per-minute
  # budget footprint than the model that got swapped out above.
  fact_checker:
    model: openai/gpt-oss-20b
    temperature: 0.0
    max_output_tokens: 4096
    pinned: true

  # Judges image relevance from captions and metadata only; a small model is
  # sufficient and keeps the build inside its deadline.
  image_finder:
    model: openai/gpt-oss-20b
    temperature: 0.0
    max_output_tokens: 1024
    pinned: false
    fallback_model: gemini-3.6-flash
