# Model assignment per LLM agent.
#
# Ids come from Groq's actual live catalog for this account, queried via
# GET /openai/v1/models and each one round-tripped through
# backend/app/llm/client.py with a Writer-shaped task (numbered passages,
# reply as strict JSON, cite passage ids) on 2026-09-18 — not from Groq's
# published docs, which listed several models (llama-3.3-70b-versatile,
# llama-3.1-8b-instant) that 404 on this account. The catalog moves fast;
# re-verify against /v1/models before trusting a doc or a blog post.
#
# Served at https://api.groq.com/openai/v1. Groq replaced freellmpool
# everywhere (dev and prod both) — see docs/BACKLOG.md — because freellmpool
# only ever served 127.0.0.1, which Cloud Run cannot reach.
#
# openai/gpt-oss-120b was the first Writer/Ranker pick, on 2026-09-18, and
# was swapped out the same day: a real build run against this account hit
# a hard 8000-tokens-per-minute limit on that model specifically (one
# single request was rejected outright for requesting 10091 tokens against
# an 8000 limit), while qwen/qwen3.8-27b succeeded on every call in the
# same run with no rate-limit errors at all. Free-tier per-model limits are
# an account fact, not something config can see in advance — verify against
# a real run's app/models/operations.py llm_calls rows before trusting a
# model choice under real load, not just a single successful smoke call.
#
# PROVISIONAL. These are chosen on live availability, vendor diversity, and
# now real-load reliability — not on measured output quality. CLAUDE.md
# requires an eval run for any model change, so treat the Writer and
# Fact-checker choices as hypotheses until /evals has run.
#
# Pinned agents must name a CONCRETE model, never a routing alias — published
# wording cannot change without an eval, which an alias that picks a
# different model per request would defeat.
#
# `orchestrator` has no real caller: app/agents/orchestrator.py has never
# made an LLM call (see its own module docstring and CLAUDE.md's agent
# table). The entry stays only because ModelsConfig's own validator requires
# every AgentKey to have one — removing it means removing "orchestrator"
# from AgentKey itself, a separate, larger cleanup, not folded in here.

request_timeout_seconds: 90.0
max_attempts: 3

agents:
  # Unused — see the module note above. Kept valid rather than a stale
  # reference to a gateway that no longer exists.
  orchestrator:
    model: openai/gpt-oss-20b
    temperature: 0.0
    max_output_tokens: 2048
    pinned: false

  # Clustering and scoring need judgement. Same model as the Writer, on the
  # same reasoning as before (may fail over, since the Fact-checker
  # re-checks after) — now qwen3.8-27b rather than gpt-oss-120b, since that
  # one's real per-minute token budget on this account cannot sustain even
  # a single genre's worth of calls.
  ranker:
    model: qwen/qwen3.8-27b
    temperature: 0.0
    # This account's real cap for this model is 1000 output tokens/minute
    # (found the hard way: a single request asking for more is rejected
    # outright, every time, regardless of retries — not a transient rate
    # limit). 900 leaves headroom rather than sitting right at the edge.
    max_output_tokens: 900
    pinned: false
    fallbacks:
      - openai/gpt-oss-20b
    # Google's Gemini free tier is a separate account's quota entirely, so
    # it survives a Groq per-minute exhaustion that no amount of retrying
    # the same account would. gemini-flash-lite-latest, not gemini-3.6-flash
    # (first tried, then reverted everywhere — see the writer entry below
    # for why: a real 5-requests/minute/project/model cap). Only used if
    # LLM_FALLBACK_URL/LLM_FALLBACK_API_KEY are set.
    fallback_model: gemini-flash-lite-latest

  # Moved off Groq entirely on 2026-09-18: a real business-genre build sent
  # qwen3.8-27b's real per-minute budget (both ITPM and OTPM) so far past
  # its limit that only 1 of ~10 attempted stories made it through Writer
  # in one run (35 OTPM 429s, 3 ITPM 413s, 1 ok — see docs/BACKLOG.md).
  #
  # First tried gemini-3.6-flash on the LLM_FALLBACK_* gateway (a separate
  # account's quota from Groq) — reverted the same day: its real free-tier
  # cap is 5 requests/minute/project/model ("RESOURCE_EXHAUSTED", quotaId
  # GenerateRequestsPerMinutePerProjectPerModel-FreeTier, quotaValue 5),
  # discovered by /evals/run.py's full suite genuinely exhausting it, not
  # a single smoke call. gemini-flash-lite-latest on the same account
  # took a 15-call rapid burst (json_object mode, realistic payload size)
  # with zero errors — verify against Google's real quota dashboard before
  # trusting this under sustained load, since AI Studio's per-model limits
  # move and "flash" vs "flash-lite" tiers are priced/limited differently.
  # Deliberately not the same model as Fact-checker (see that entry below):
  # collapsing both onto one model would defeat the vendor-diversity
  # reasoning it describes.
  #
  # PROVISIONAL: /evals/run.py's groundedness and tag_accuracy evals pass
  # against this model (see docs/BACKLOG.md), but that is one run against
  # two synthetic fixtures, not a judgment on real output quality at scale.
  writer:
    model: gemini-flash-lite-latest
    gateway: fallback
    temperature: 0.2
    max_output_tokens: 900
    pinned: true

  # Moved off Groq's "gpt-oss" family on 2026-09-18: found live that
  # gpt-oss-20b, gpt-oss-120b, and gpt-oss-safeguard-20b all share the
  # SAME 8000-tokens-per-minute cap on this account (a family limit, not
  # a per-model-id one — confirmed by the identical "Limit 8000" text in
  # real llm_calls.error rows for two different model ids), so no model
  # swap within that family could have helped; a real build's Fact-checker
  # phase logged 63 errors against 5 successes. qwen/qwen3.8-27b (Groq,
  # a different family) was tried next and did worse under the same
  # fact-check-shaped burst test (4/15 OK, its 1000 OTPM cap binds harder
  # than gpt-oss's 8000 TPM in practice).
  #
  # Cloudflare Workers AI's llama-3.3-70b-instruct-fp8-fast took a 20/20
  # burst under realistic fact-check-shaped load with zero errors — a
  # genuinely different vendor from both Groq (Ranker/Ranker-fallback-free)
  # and Gemini (Writer's gateway), preserving the vendor-diversity
  # reasoning this field used to describe when Fact-checker was still on
  # Groq: a checker that shares the Writer's blind spots is worth much
  # less. Free tier is ~10,000 neurons/day account-wide (one call here
  # costs ~20 neurons), so roughly 500 real calls/day — ample for one
  # build's Fact-checker phase, tight if hammered by repeated manual
  # testing across many genres in one day.
  #
  # PROVISIONAL: not yet run through /evals/run.py's groundedness eval
  # (which drives Writer+Fact-checker together) — do that before trusting
  # this under real load, per CLAUDE.md's eval-gate rule for model changes.
  # Added 2026-09-18: Cloudflare's free tier is a DAILY cap (10,000
  # neurons/day, not per-minute), found live when a whole day's testing
  # exhausted it outright — "you have used up your daily free allocation
  # of 10,000 neurons" — no amount of backoff recovers that within the
  # same day. gpt-oss-20b on Groq (this agent's own original model,
  # before the move above) is the availability escape hatch: tried only
  # when every attempt on Cloudflare fails with an availability error,
  # never for a fatal one. Deliberately NOT a routine fallback_model —
  # Fact-checker stays pinned to Cloudflare under normal conditions, so
  # its verification calibration doesn't vary run-to-run on a healthy day.
  fact_checker:
    model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
    gateway: secondary
    temperature: 0.0
    max_output_tokens: 4096
    pinned: true
    availability_fallback_model: openai/gpt-oss-20b
    availability_fallback_gateway: primary

  # Judges image relevance from captions and metadata only; a small model is
  # sufficient and keeps the build inside its deadline.
  image_finder:
    model: openai/gpt-oss-20b
    temperature: 0.0
    max_output_tokens: 1024
    pinned: false
    fallback_model: gemini-flash-lite-latest
