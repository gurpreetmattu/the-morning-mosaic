# Model assignment per LLM agent.
#
# Ids come from Groq's actual live catalog for this account, queried via
# GET /openai/v1/models and each one round-tripped through
# backend/app/llm/client.py with a Writer-shaped task (numbered passages,
# reply as strict JSON, cite passage ids) on 2026-09-18 — not from Groq's
# published docs, which listed several models (llama-3.3-70b-versatile,
# llama-3.1-8b-instant) that 404 on this account. The catalog moves fast;
# re-verify against /v1/models before trusting a doc or a blog post.
#
# Served at https://api.groq.com/openai/v1. Groq replaced freellmpool
# everywhere (dev and prod both) — see docs/BACKLOG.md — because freellmpool
# only ever served 127.0.0.1, which Cloud Run cannot reach.
#
# PROVISIONAL. These are chosen on live availability and vendor diversity,
# not on measured output quality. CLAUDE.md requires an eval run for any
# model change, so treat the Writer and Fact-checker choices as hypotheses
# until /evals has run.
#
# Pinned agents must name a CONCRETE model, never a routing alias — published
# wording cannot change without an eval, which an alias that picks a
# different model per request would defeat.
#
# `orchestrator` has no real caller: app/agents/orchestrator.py has never
# made an LLM call (see its own module docstring and CLAUDE.md's agent
# table). The entry stays only because ModelsConfig's own validator requires
# every AgentKey to have one — removing it means removing "orchestrator"
# from AgentKey itself, a separate, larger cleanup, not folded in here.

request_timeout_seconds: 90.0
max_attempts: 3

agents:
  # Unused — see the module note above. Kept valid rather than a stale
  # reference to a gateway that no longer exists.
  orchestrator:
    model: openai/gpt-oss-20b
    temperature: 0.0
    max_output_tokens: 2048
    pinned: false

  # Clustering and scoring need judgement, so this uses the same capable
  # model as the Writer, but may fail over because the Fact-checker
  # re-checks after.
  ranker:
    model: openai/gpt-oss-120b
    temperature: 0.0
    max_output_tokens: 4096
    pinned: false
    fallbacks:
      - openai/gpt-oss-20b

  # The largest model on this account's live catalog. Verified: valid JSON,
  # correct passage citations, against a Writer-shaped prompt.
  writer:
    model: openai/gpt-oss-120b
    temperature: 0.2
    max_output_tokens: 4096
    pinned: true

  # Deliberately a different vendor lineage from the Writer (Qwen/Alibaba,
  # not OpenAI-OSS): a checker that shares the Writer's blind spots is worth
  # much less. Verified: valid JSON, correct passage citations.
  fact_checker:
    model: qwen/qwen3.8-27b
    temperature: 0.0
    max_output_tokens: 4096
    pinned: true

  # Judges image relevance from captions and metadata only; a small model is
  # sufficient and keeps the build inside its deadline.
  image_finder:
    model: openai/gpt-oss-20b
    temperature: 0.0
    max_output_tokens: 1024
    pinned: false
