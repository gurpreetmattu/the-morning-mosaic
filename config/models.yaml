# Model assignment per LLM agent.
#
# Ids come from the freellmpool gateway, listed with `freellmpool models` and
# served at http://127.0.0.1:8080/v1.
#
# Every id below was verified on 2026-09-16 by sending a Writer-shaped task
# through backend/app/llm/client.py: rewrite from numbered passages, cite the
# passage ids, reply as strict JSON. Each one returned valid JSON with correct
# citations. Latency is the single measured sample, not an average.
#
# PROVISIONAL. These are chosen on verified behaviour and latency, not on
# measured output quality — most of these models postdate any benchmark we
# hold. CLAUDE.md requires an eval run for any model change, so treat the
# Writer and Fact-checker choices as hypotheses until /evals has run.
#
# Pinned agents must name a CONCRETE model, never a routing alias. The gateway
# offers aliases (llm7/default, kilo/kilo-auto/free, kilo/openrouter/free)
# that pick a model per request. Those are fine for agents whose output is
# re-checked downstream, but they defeat the purpose of pinning, which is that
# published wording cannot change without an eval.
#
# The free tiers are genuinely unreliable: during verification the whole OVH
# provider was rate-limited into a circuit-open state, Pollinations returned
# 402 Payment Required, and four ids in the gateway's own catalogue 404'd or
# 401'd upstream. The client fails loudly rather than substituting silently,
# which is correct, but it means a vanished pinned model stops the build.

request_timeout_seconds: 90.0
max_attempts: 3

agents:
  # Light supervisory calls; alias is fine, output is not published.
  orchestrator:
    model: llm7/default
    temperature: 0.0
    max_output_tokens: 2048
    pinned: false
    fallbacks:
      - kilo/kilo-auto/free

  # Clustering and scoring need judgement, so this uses the same capable model
  # as the Writer, but may fail over because the Fact-checker re-checks after.
  ranker:
    model: kilo/nvidia/nemotron-3-super-120b-a12b:free
    temperature: 0.0
    max_output_tokens: 4096
    pinned: false
    fallbacks:
      - kilo/kilo-auto/free
      - llm7/default

  # Verified: valid JSON, correct passage citations, ~2.3s.
  writer:
    model: kilo/nvidia/nemotron-3-super-120b-a12b:free
    temperature: 0.2
    max_output_tokens: 4096
    pinned: true

  # Deliberately a different vendor from the Writer: a checker that shares the
  # Writer's blind spots is worth much less. Verified: valid JSON, ~2.5s.
  # Note its "code" naming — confirm suitability for prose claims in evals.
  fact_checker:
    model: kilo/cohere/north-mini-code:free
    temperature: 0.0
    max_output_tokens: 4096
    pinned: true

  # Judges image relevance from captions and metadata only; a small model is
  # sufficient and keeps the build inside its deadline.
  image_finder:
    model: llm7/default
    temperature: 0.0
    max_output_tokens: 1024
    pinned: false
    fallbacks:
      - kilo/liquid/lfm-2.5-2.6b:free
