# The ten genres. One fixed theme each; variety comes from special editions.
#
# `enabled: false` keeps a genre defined but out of the build, the signup choices and
# /api/config. Launch set (2026-10-01): india, business, technology, ai, sports, each with
# pool_size 6 - sized to what the free LLM tiers can carry (see docs/BACKLOG.md).
# Re-enable a genre by flipping it to true; nothing else changes.
#
# `topic_tags` is the CLOSED taxonomy the Writer may choose from for this genre.
# The Fact-checker rejects any tag outside this list, and keyword matching runs
# against these tags, so adding or renaming a tag is a product change.
#
# `corroboration: strict` = needs >=2 independent tier-1/2 sources, or one
# primary official source (CLAUDE.md, "Corroboration").

# When the same story is pooled by two genres, the genre listed first keeps it and the others
# drop it (app/agents/crossgenre.py). Most specific first, broadest last. Genres not listed
# follow in the order below.
dedup_priority:
  - ai
  - sports
  - gaming
  - bollywood
  - hollywood
  - music
  - business
  - politics
  - technology
  - india

genres:
  - key: india
    display_name: India
    section_title: Across India
    blurb: The day's most consequential national news.
    corroboration: strict
    enabled: true
    pool_size: 6
    theme:
      accent: "#A63F08"
      accent_soft: "#F6DCC3"
      rule: "#C9B98F"
      heading_font: "Georgia, 'Times New Roman', serif"
      body_font: "Georgia, 'Times New Roman', serif"
    topic_tags:
      - national-policy
      - state-affairs
      - judiciary
      - law-and-order
      - infrastructure
      - public-health
