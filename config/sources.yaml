        genres: [business]
      # Added 2026-09-18: sports and bollywood each had only one enabled
      # source (the-hindu; bollywood-hungama), so neither genre could ever
      # clear the ">=2 independent sources" corroboration bar except via
      # the single-source exception. Both verified live before adding:
