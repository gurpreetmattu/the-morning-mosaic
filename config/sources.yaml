    name: Press Information Bureau
    homepage: https://www.pib.gov.in/
    tier: 1
    terms_url: https://www.pib.gov.in/Disclaimer.aspx
    feeds:
      - url: https://www.pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3
        genres: [india, politics]
    notes: Primary source for Government of India announcements.

  - key: rbi
