# The source whitelist. Nothing outside this file is ever fetched.
#
# EVERY source ships disabled. `enabled: true` is rejected unless BOTH
# `terms_confirmed` and `robots_checked` are true, which is a human judgement,
# not something that can be inferred. Before flipping a source on:
#
#   1. Read its terms at `terms_url` and confirm they permit reproducing
#      headlines and short original summaries in an email newsletter.
#   2. Check its robots.txt allows fetching the article URLs.
#   3. Record what you concluded in `notes`, then set both flags.
#
# tier 1 = wire services, official bodies, primary sources
# tier 2 = established outlets
# tier 3 = entertainment / gossip (hedged language required)
#
# Every feed URL below was checked to fetch and parse into entries on
# 2026-09-15. Reachability is NOT permission — the terms review above is still
# required before `enabled: true`.
#
# The Collector identifies itself honestly and does not pretend to be a
# browser. A source that blocks an identified crawler is telling us not to
# fetch it; working around that would contradict rule 2 above. Such a source
# stays disabled until the terms review resolves the question.

sources:
  # ---------------------------------------------------------------- tier 1
  - key: pib-india
    name: Press Information Bureau
    homepage: https://www.pib.gov.in/
    tier: 1
    terms_url: https://www.pib.gov.in/Disclaimer.aspx
    feeds:
      - url: https://www.pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3
        genres: [india, politics]
    notes: Primary source for Government of India announcements.

  - key: rbi
    name: Reserve Bank of India
    homepage: https://www.rbi.org.in/
    tier: 1
    terms_url: https://www.rbi.org.in/Scripts/Disclaimer.aspx
    terms_confirmed: true
    robots_checked: true
    enabled: true
    # Its pubDate has no timezone offset ("Thu, 17 Sep 2026 19:00:00"),
    # which feedparser cannot parse at all — every item was being dropped
    # for no reliable published_at, not a terms/robots problem. RBI is a
    # domestic Indian institution publishing its own press timestamps, so
    # IST is the source's own known timezone, not a guess about content.
    fallback_timezone: Asia/Kolkata
    feeds:
      - url: https://www.rbi.org.in/pressreleases_rss.xml
        genres: [business]
      - url: https://www.rbi.org.in/notifications_rss.xml
        genres: [business]
    notes: >-
      Owner's call, reviewed 2026-09-18. Disclaimer page (checked live) says
      nothing about republishing or redistributing content — only about
      linking and framing ("caching and links to, and the framing of this
      Web Site... are prohibited" without written permission). Treated as
      acceptable for press-release content, which RBI issues for press
      pickup. robots.txt itself returns HTTP 418 to an identified crawler
      (a WAF block page, not real robots.txt content), but the actual feed
      URLs return 200 and parse cleanly — inconsistent, but the feeds
      themselves are not blocking us. Primary source for monetary policy
      and banking regulation.

