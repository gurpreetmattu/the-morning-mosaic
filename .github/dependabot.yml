version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # Major bumps break the toolchain (eslint 10, TS 7) or runtime; do them deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # Major bumps break the toolchain (eslint 10, TS 7) or runtime; do them deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: monthly }
    # Major bumps break the toolchain (eslint 10, TS 7) or runtime; do them deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    # Major bumps break the toolchain (eslint 10, TS 7) or runtime; do them deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
    # Major bumps break the toolchain (eslint 10, TS 7) or runtime; do them deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
