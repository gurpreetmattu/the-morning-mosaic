name: Nightly evals

# CLAUDE.md: "full evals nightly." Today this runs the exact same suite as
# the PR job (ci.yml) — the suite is small enough that there is no
# meaningful "subset" to carve out of it yet — but it exists as its own
# workflow so a genuinely larger nightly-only run (bigger fixtures, say) has
# somewhere to grow without touching what PRs wait on. If the variable
# EVAL_LLM_GATEWAY_URL and the secret LLM_GATEWAY_API_KEY are ever set, pointing at a
# reachable gateway, the LLM-dependent evals (see evals/README.md) start scoring for real
# here with no workflow change needed. It is deliberately NOT the LLM_GATEWAY_URL variable
# the deploy workflow uses: that one is a real, reachable endpoint, and with no API key the
# evals would run and fail instead of being skipped.

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://user:pass@localhost/unused
      SMTP_HOST: smtp.example.com
      SENDER_EMAIL: news@example.com
      SENDER_NAME: The Morning Mosaic
      GMAIL_APP_PASSWORD: unused-in-ci
      IMAP_HOST: imap.example.com
      ADMIN_EMAIL: admin@example.com
      LLM_GATEWAY_URL: ${{ vars.EVAL_LLM_GATEWAY_URL || 'http://127.0.0.1:8080/v1' }}
      LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY || 'unused-in-ci' }}
      TOKEN_SIGNING_KEY: unused-in-ci
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.11"
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: eval suite
        run: uv run python -m evals.run --verbose
