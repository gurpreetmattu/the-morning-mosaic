name: Deploy

# CLAUDE.md: "deploy on merge to main." Builds and pushes both images to
# Artifact Registry, then applies Terraform.
#
# There is no GCP project yet (docs/BACKLOG.md's biggest set of blockers),
# so `gate` below always evaluates false today and every other job is
# skipped — this workflow is written and ready, not yet live. It starts
# doing anything the moment a repository variable named GCP_PROJECT_ID is
# set; until then a push to main runs CI (ci.yml) and nothing else.
#
# Authentication is Workload Identity Federation, not a downloaded service
# account key: nothing here is a long-lived credential sitting in GitHub's
# secret store to leak.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: echo "ready=${{ vars.GCP_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: build and push the backend image
        run: |
          image="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/the-morning-mosaic/backend:${{ env.IMAGE_TAG }}"
          docker build -f backend/Dockerfile -t "$image" .
          docker push "$image"

      - name: build and push the web image
        run: |
          image="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/the-morning-mosaic/web:${{ env.IMAGE_TAG }}"
          docker build -f frontend/Dockerfile -t "$image" frontend
          docker push "$image"

  terraform-apply:
    needs: [gate, build-and-push]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      # base_url is deliberately not set here: it starts on the placeholder
      # from variables.tf until a human runs `terraform output web_url` and
      # sets it for real once — see infra/README.md's "Apply, twice". This
      # workflow just repeats whatever's already in terraform.tfvars/state
      # with fresh images.
      - name: terraform apply
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="sender_email=${{ vars.SENDER_EMAIL }}" \
            -var="admin_email=${{ vars.ADMIN_EMAIL }}" \
            -var="freellmpool_url=${{ vars.FREELLMPOOL_URL }}" \
            -var="backend_image=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/the-morning-mosaic/backend:${{ env.IMAGE_TAG }}" \
            -var="web_image=${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/the-morning-mosaic/web:${{ env.IMAGE_TAG }}"
